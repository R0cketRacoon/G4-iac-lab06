# Workflow reutilizable: despliega o destruye UN entorno con el contenedor de
# herramientas. Lo llaman despliegue.yml y destruir.yml.

name: aplicar-entorno

on:
  workflow_call:
    inputs:
      entorno:
        required: true
        type: string
      accion:
        description: desplegar o destruir
        required: false
        type: string
        default: desplegar

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: ${{ inputs.accion }} ${{ inputs.entorno }}
    runs-on: ubuntu-latest

    # El environment de GitHub pide aprobación manual en qa y prod.
    environment: ${{ inputs.entorno }}

    concurrency:
      group: terraform-${{ inputs.entorno }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Descargar los paquetes de las Lambdas
        if: inputs.accion == 'desplegar'
        uses: actions/download-artifact@v4
        with:
          name: paquetes-lambdas
          path: app/dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.REGION_AWS }}

      # Sin llaves en el código: las credenciales temporales (1 hora) de OIDC
      # se guardan como perfil de AWS CLI, que es lo único que usa Terraform.
      - name: Guardar credenciales temporales como perfil de AWS CLI
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile image-processor-ci
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile image-processor-ci
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile image-processor-ci
          aws configure set region "${{ vars.REGION_AWS }}" --profile image-processor-ci

      - name: Crear .env desde las variables de GitHub
        run: |
          cat > .env <<EOF
          ID_CUENTA_AWS=${{ vars.ID_CUENTA_AWS }}
          REGION_AWS=${{ vars.REGION_AWS }}
          PERFIL_AWS=image-processor-ci
          NOMBRE_PROYECTO=image-processor
          BUCKET_ESTADO=${{ vars.BUCKET_ESTADO }}
          ORGANIZACION_GITHUB=${{ github.repository_owner }}
          REPOSITORIO_GITHUB=${{ github.event.repository.name }}
          CORREO_ALERTAS=${{ vars.CORREO_ALERTAS }}
          EOF

      - name: Construir el contenedor de herramientas
        run: docker compose build herramientas

      - name: proyecto ${{ inputs.accion }} ${{ inputs.entorno }}
        run: docker compose run --rm -T herramientas ${{ inputs.accion }} ${{ inputs.entorno }}

      - name: Resumen
        if: inputs.accion == 'desplegar'
        run: |
          echo "### ${{ inputs.entorno }} desplegado" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker compose run --rm -T herramientas salidas ${{ inputs.entorno }} >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar la salida del destroy como evidencia
        if: always() && inputs.accion == 'destruir'
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-destroy-${{ inputs.entorno }}
          path: docs/evidencias/destroy/